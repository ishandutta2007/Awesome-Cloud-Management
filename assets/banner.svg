<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="40%" stop-color="#0d1527" />
      <stop offset="80%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#090d18" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="purplePinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.35" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="90" r="180" fill="url(#glowCyan)">
    <animate attributeName="cx" values="200; 250; 200" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cy" values="90; 130; 90" dur="8s" repeatCount="indefinite" />
  </circle>

  <circle cx="1000" cy="300" r="220" fill="url(#glowPurple)">
    <animate attributeName="cx" values="1000; 950; 1000" dur="10s" repeatCount="indefinite" />
    <animate attributeName="cy" values="300; 260; 300" dur="10s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Multi-Cloud Circuit & Flow Lines in Background -->
  <g stroke-linecap="round" opacity="0.6">
    <!-- Connecting Wire 1 -->
    <path d="M 120 330 Q 300 370 500 330 T 900 330" fill="none" stroke="#1e293b" stroke-width="3" />
    <path d="M 120 330 Q 300 370 500 330 T 900 330" fill="none" stroke="url(#cyanBlueGrad)" stroke-width="3" stroke-dasharray="80 300">
      <animate attributeName="stroke-dashoffset" values="380; 0" dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Connecting Wire 2 -->
    <path d="M 300 70 Q 600 20 900 65 T 1100 80" fill="none" stroke="#1e293b" stroke-width="2.5" />
    <path d="M 300 70 Q 600 20 900 65 T 1100 80" fill="none" stroke="url(#purplePinkGrad)" stroke-width="2.5" stroke-dasharray="60 260">
      <animate attributeName="stroke-dashoffset" values="320; 0" dur="6s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Left Dynamic Floating Badge Card: FinOps Metrics -->
  <g filter="url(#dropShadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="5s" repeatCount="indefinite" />
    <rect x="60" y="70" width="220" height="74" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="95" cy="107" r="18" fill="#0284c7" fill-opacity="0.3" />
    <!-- FinOps Coin/Trend Icon -->
    <path d="M 88 112 L 94 103 L 99 108 L 105 99" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="124" y="99" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">FINOPS METRIC</text>
    <text x="124" y="121" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="800">-34% Waste Reduced</text>
  </g>

  <!-- Left Lower Dynamic Floating Badge Card: Multi-Cloud Providers -->
  <g filter="url(#dropShadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 8; 0 0" dur="6.5s" repeatCount="indefinite" />
    <rect x="80" y="270" width="230" height="70" rx="12" fill="url(#cardBg)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="112" cy="305" r="16" fill="#6366f1" fill-opacity="0.3" />
    <!-- Cloud Nodes Icon -->
    <circle cx="106" cy="308" r="4" fill="#a5b4fc" />
    <circle cx="118" cy="308" r="4" fill="#a5b4fc" />
    <circle cx="112" cy="298" r="5" fill="#c7d2fe" />
    <text x="140" y="297" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">ORCHESTRATION</text>
    <text x="140" y="318" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">AWS • Azure • GCP</text>
  </g>

  <!-- Right Dynamic Floating Badge Card: Governance & IaC -->
  <g filter="url(#dropShadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="5.5s" repeatCount="indefinite" />
    <rect x="910" y="80" width="230" height="74" rx="12" fill="url(#cardBg)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="945" cy="117" r="18" fill="#9333ea" fill-opacity="0.3" />
    <!-- Shield / Policy Icon -->
    <path d="M 945 106 L 954 110 V 119 C 954 125 945 128 945 128 C 945 128 936 125 936 119 V 110 Z" fill="none" stroke="#c084fc" stroke-width="2" stroke-linejoin="round" />
    <text x="975" y="108" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">POLICY &amp; GOVERNANCE</text>
    <text x="975" y="130" fill="#f3e8ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">OPA • Drift Guard</text>
  </g>

  <!-- Right Lower Dynamic Floating Badge Card: Cost Efficiency -->
  <g filter="url(#dropShadow)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 10; 0 0" dur="7s" repeatCount="indefinite" />
    <rect x="890" y="260" width="240" height="74" rx="12" fill="url(#cardBg)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="925" cy="297" r="18" fill="#059669" fill-opacity="0.3" />
    <!-- Check Pulse Icon -->
    <path d="M 917 298 L 923 304 L 934 291" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="955" y="288" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OPEN-SOURCE FINOPS</text>
    <text x="955" y="310" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">100% Sovereign Stack</text>
  </g>

  <!-- FOREGROUND LAYER: MAIN TITLES (Guaranteed in foreground, never obstructed) -->
  <g id="foreground-content" filter="url(#dropShadow)">
    <!-- Category Pill Tag -->
    <g transform="translate(600, 115)">
      <rect x="-140" y="-18" width="280" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="url(#cyanBlueGrad)" stroke-width="1.5" />
      <!-- Pulsing Green Dot -->
      <circle cx="-115" cy="-1" r="5" fill="#10b981">
        <animate attributeName="r" values="4; 6; 4" dur="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8; 1; 0.8" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="10" y="5" fill="#38bdf8" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="2">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title with Gradient fill and crisp drop shadow -->
    <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" fill="#ffffff" filter="url(#glowFilter)">
      AWESOME CLOUD MANAGEMENT
    </text>

    <!-- Subtitle -->
    <text x="600" y="235" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Multi-Cloud Orchestration • FinOps &amp; Cost Intelligence • Infrastructure Governance
    </text>

    <!-- Feature Tags Row below subtitle -->
    <g transform="translate(600, 275)">
      <!-- Tag 1 -->
      <rect x="-240" y="-12" width="130" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
      <text x="-175" y="4" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">☁️ Multi-Cloud CMP</text>
      <!-- Tag 2 -->
      <rect x="-95" y="-12" width="115" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
      <text x="-37" y="4" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">💰 FinOps Control</text>
      <!-- Tag 3 -->
      <rect x="35" y="-12" width="105" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
      <text x="87" y="4" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🛡️ IaC Guardrails</text>
      <!-- Tag 4 -->
      <rect x="155" y="-12" width="100" height="24" rx="6" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1" />
      <text x="205" y="4" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🚀 Open-Source</text>
    </g>
  </g>
</svg>
